<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeoAttend-HKN62</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
    /* =========================================================
1. Design tokens
       ========================================================= */
    :root {
      --brand: #168653;
      --brand-teal: #009688;
      --brand-dark: #0f6540;
      --brand-deep: #0b4d32;
      --brand-soft: #eaf7f0;
      --brand-pale: #f5fbf7;
      --ink: #172b3a;
      --muted: #64748b;
      --line: #d8e7df;
      --surface: #ffffff;
      --page: #f2f7f4;
      --danger: #b42318;
      --radius-sm: 9px;
      --radius-md: 14px;
      --radius-lg: 12px;
      --shadow-card: 0 14px 38px rgba(17, 83, 54, 0.09);
      --shadow-control: 0 4px 12px rgba(17, 83, 54, 0.10);
      --font: "Plus Jakarta Sans", Arial, sans-serif;
    }

    /* =========================================================
2. Base and page layout
       ========================================================= */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      font-size: 14px;
      scroll-behavior: smooth;
    }

    body {
      display: flex;
      min-height: 100vh;
      justify-content: center;
      align-items: flex-start;
      margin: 0;
      padding: 14px;
      background:
        radial-gradient(circle at 8% 0%, rgba(22, 134, 83, 0.10), transparent 28rem),
        radial-gradient(circle at 100% 20%, rgba(0, 150, 136, 0.08), transparent 24rem),
        var(--page);
      color: var(--ink);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .card {
      position: relative;
      width: min(100%, 425px);
      overflow: hidden;
      padding: 18px 16px 16px;
      border: 1px solid rgba(216, 231, 223, 0.95);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: var(--shadow-card);
    }

    .accent {
      position: absolute;
      inset: 0 0 auto;
      height: 5px;
      background: linear-gradient(90deg, #0f6540 0%, #168653 50%, #009688 100%);
    }

    /* =========================================================
3. Banner & unified event hero card
       ========================================================= */
    .banner {
      display: block;
      width: 100%;
      height: auto;
      margin: 0 0 14px;
      border-radius: var(--radius-md);
      object-fit: contain;
    }

    .event-card {
      margin: 0 0 16px;
      padding: 14px 14px 13px;
      border: 1px solid #cce7db;
      border-radius: var(--radius-md);
      background:
        radial-gradient(circle at 100% 0%, rgba(0, 150, 136, 0.08), transparent 14rem),
        linear-gradient(160deg, #effaf4 0%, #f7fcfa 60%, #eef8f6 100%);
      box-shadow: 0 4px 14px rgba(15, 101, 64, 0.05);
      text-align: center;
    }

    .date-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      margin: 0 auto 10px;
      padding: 4px 11px;
      border: 1px solid #c6e6d7;
      border-radius: 999px;
      background: #ffffff;
      color: var(--brand-dark);
      font-size: 11px;
      font-weight: 700;
      box-shadow: 0 1px 3px rgba(15, 101, 64, 0.05);
    }

    .event-card h2,
    #eventTitle {
      margin: 0 auto 9px;
      color: #027376;
      font-size: clamp(18px, 3vw, 22px);
      font-weight: 800;
      line-height: 1.28;
      letter-spacing: -0.03em;
      text-align: center;
    }

    .event-meta {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 5px;
      margin: 0 auto 12px;
    }

    .meta-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3.5px 9px;
      border: 1px solid #cde7db;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.85);
      color: var(--brand-dark);
      font-size: 10px;
      font-weight: 700;
      line-height: 1.3;
    }

    .meta-pill.is-open {
      border-color: #dbe4ea;
      background: #f8fafc;
      color: #475569;
    }

    .event-divider {
      height: 1px;
      margin: 0 0 11px;
      border: 0;
      background: linear-gradient(90deg, transparent, #c7e5d6, transparent);
    }

    .instructions {
      margin: 0;
      padding: 10px 11px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(204, 231, 219, 0.85);
      color: #314e41;
      font-size: 11.2px;
      line-height: 1.55;
      text-align: left;
    }

    .instructions-title {
      margin: 0 0 7px;
      font-weight: 600;
    }

    .store-links {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .store-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border: 1px solid #bfe2d2;
      border-radius: 999px;
      background: #eaf7f2;
      color: var(--brand-dark);
      font-size: 12.5px;
      font-weight: 800;
      line-height: 1.25;
      text-decoration: none;
      transition: background 150ms ease, border-color 150ms ease, transform 150ms ease;
    }

    .store-icon {
      display: block;
      width: 15px;
      height: 15px;
      flex: 0 0 15px;
      object-fit: contain;
    }

    .store-chip:hover {
      background: #dcf2e9;
      border-color: #93ceb5;
      transform: translateY(-1px);
    }

    /* =========================================================
4. Attendance form and input controls
       ========================================================= */
    #geoForm {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px 12px;
    }

    .group {
      min-width: 0;
    }

    .full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      margin: 0 0 5px;
      color: #263c31;
      font-size: 11px;
      font-weight: 700;
    }

    input[type="text"],
    input[type="tel"] {
      display: block;
      width: 100%;
      min-width: 0;
      min-height: 40px;
      padding: 8px 11px;
      border: 1px solid var(--line);
      border-radius: 10px;
      outline: none;
      background: #fff;
      color: var(--ink);
      font-family: var(--font);
      font-size: 12px;
      font-weight: 500;
      transition: border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    input::placeholder {
      color: #94a3a0;
      font-weight: 400;
    }

    input:focus-visible {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(22, 134, 83, 0.12);
    }

    /* =========================================================
4b. Searchable Autocomplete Dropdown (Nama & NIP)
       ========================================================= */
    .ac-wrap {
      position: relative;
    }

    .ac-wrap input {
      padding-right: 30px;
    }

    .ac-search-icon {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 14px;
      height: 14px;
      color: #8ba398;
      pointer-events: none;
    }

    .ac-list {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 4px);
      z-index: 50;
      display: none;
      max-height: 210px;
      overflow-y: auto;
      margin: 0;
      padding: 4px;
      list-style: none;
      border: 1px solid #bfe2d2;
      border-radius: 11px;
      background: #ffffff;
      box-shadow: 0 12px 28px rgba(15, 101, 64, 0.15);
    }

    .ac-list.is-open {
      display: block;
    }

    .ac-item {
      padding: 7px 9px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 120ms ease;
    }

    .ac-item + .ac-item {
      margin-top: 2px;
    }

    .ac-item:hover,
    .ac-item.is-active {
      background: #eaf7f1;
    }

    .ac-name {
      color: var(--ink);
      font-size: 11.5px;
      font-weight: 700;
      line-height: 1.3;
    }

    .ac-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 2px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 600;
    }

    .ac-mark {
      padding: 0 2px;
      border-radius: 3px;
      background: #d2f1e2;
      color: var(--brand-deep);
      font-weight: 800;
    }

    .ac-empty {
      padding: 8px 10px;
      color: var(--muted);
      font-size: 10.5px;
      text-align: center;
    }

    .ac-filled-flash {
      animation: ac-flash 700ms ease;
    }

    @keyframes ac-flash {
      0% { background-color: #dff5ea; border-color: var(--brand); }
      100% { background-color: #ffffff; border-color: var(--line); }
    }

    /* Visually hidden native file input */
    .sr-only-input {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* Custom Kemenkes green-teal upload button (adapted from Uiverse.io by SpatexDEV) */
    .upload-wrapper {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .upload-btn {
      border: none;
      display: flex;
      width: 100%;
      min-height: 44px;
      padding: 0.75rem 1.5rem;
      background: linear-gradient(135deg, #168653 0%, #009688 100%);
      color: #ffffff;
      font-family: var(--font);
      font-size: 0.78rem;
      line-height: 1rem;
      font-weight: 700;
      text-align: center;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      vertical-align: middle;
      align-items: center;
      justify-content: center;
      border-radius: 0.65rem;
      user-select: none;
      gap: 0.75rem;
      box-shadow:
        0 4px 10px -1px rgba(22, 134, 83, 0.28),
        0 2px 4px -1px rgba(0, 150, 136, 0.16);
      transition: all 0.35s ease;
    }

    .upload-btn:hover {
      transform: translateY(-1px);
      background: linear-gradient(135deg, #137649 0%, #008578 100%);
      box-shadow:
        0 10px 18px -3px rgba(22, 134, 83, 0.35),
        0 4px 6px -2px rgba(0, 150, 136, 0.20);
    }

    .upload-btn:focus-visible {
      outline: 3px solid rgba(0, 150, 136, 0.28);
      outline-offset: 2px;
    }

    .upload-btn:active {
      opacity: 0.88;
      transform: translateY(0);
      box-shadow: none;
    }

    .upload-btn svg {
      width: 1.25rem;
      height: 1.25rem;
      flex-shrink: 0;
    }

    .file-status {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border: 1px dashed #c8e3d6;
      border-radius: 8px;
      background: #f7fcf9;
      color: #5b7268;
      font-size: 10.5px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-status.has-file {
      border-style: solid;
      border-color: #9ed4bc;
      background: #eaf7f1;
      color: var(--brand-dark);
    }

    /* =========================================================
5. Map header and GPS refresh control
       ========================================================= */
    .map-head {
      display: flex;
      grid-column: 1 / -1;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 2px 0 -4px;
    }

    .map-head label {
      margin: 0;
    }

    .refresh-btn {
      display: inline-flex;
      width: auto;
      min-height: 30px;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 4px 9px;
      border: 1px solid #d4ebde;
      border-radius: 999px;
      background: #f2faf5;
      color: var(--brand-dark);
      font-family: var(--font);
      font-size: 10px;
      font-weight: 800;
      cursor: pointer;
      transition: background 160ms ease, border-color 160ms ease, transform 160ms ease;
    }

    .refresh-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      border-color: #a9d8bd;
      background: #e7f6ed;
    }

    .refresh-btn:disabled {
      background: #f2faf5 !important;
      color: var(--brand-dark);
      cursor: wait;
      opacity: 0.8;
    }

    .refresh-icon {
      display: block;
      width: 14px;
      height: 14px;
      flex: 0 0 14px;
      transform-origin: 50% 50%;
    }

    .refresh-btn.is-loading .refresh-icon {
      animation: gps-refresh-spin 0.85s linear infinite;
    }

    @keyframes gps-refresh-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    #map {
      display: none;
      width: 100%;
      height: 195px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 11px;
      z-index: 1;
    }

    /* =========================================================
6. Check-in / check-out buttons and status
       ========================================================= */
    .buttons {
      display: grid;
      grid-column: 1 / -1;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 2px;
    }

    .buttons button {
      display: flex;
      width: 100%;
      min-height: 42px;
      align-items: center;
      justify-content: center;
      padding: 9px 12px;
      border: 0;
      border-radius: 10px;
      color: #fff;
      font-family: var(--font);
      font-size: 11.5px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
    }

    .buttons button:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: var(--shadow-control);
      filter: saturate(1.06);
    }

    .buttons button:focus-visible,
    .refresh-btn:focus-visible {
      outline: 3px solid rgba(22, 134, 83, 0.24);
      outline-offset: 2px;
    }

    .checkin {
      background: linear-gradient(135deg, #168653, #24a66b);
    }

    .checkout {
      background: linear-gradient(135deg, #0f6540, #00897b);
    }

    .buttons button:disabled {
      background: #aab7b0 !important;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    #status {
      min-height: 18px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 10.5px;
      font-weight: 600;
      line-height: 1.45;
      text-align: center;
    }

    .footer {
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px solid #e7eee9;
      color: var(--muted);
      font-size: 11px;
      text-align: center;
    }

    /* =========================================================
7. Result modal
       ========================================================= */
    .modal {
      position: fixed;
      z-index: 9999;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
      background: rgba(23, 43, 58, 0.56);
      backdrop-filter: blur(5px);
    }

    .modal-box {
      width: min(100%, 360px);
      padding: 20px 18px;
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 22px 60px rgba(0, 0, 0, 0.18);
      text-align: center;
    }

    .modal-icon {
      display: flex;
      width: 46px;
      height: 46px;
      align-items: center;
      justify-content: center;
      margin: 0 auto 10px;
      border-radius: 50%;
      font-size: 24px;
      font-weight: 800;
    }

    .success {
      background: #eaf8f2;
      color: var(--brand);
    }

    .error {
      background: #fff1f0;
      color: var(--danger);
    }

    .modal-box h3 {
      margin: 0 0 6px;
      font-size: 17px;
      font-weight: 800;
    }

    .modal-box p {
      margin: 0 0 14px;
      color: #52616b;
      font-size: 11px;
      line-height: 1.55;
      overflow-wrap: anywhere;
    }

    .modal-btn {
      display: flex;
      width: 100%;
      min-height: 40px;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 10px;
      background: var(--brand);
      color: #fff;
      font-family: var(--font);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .modal-btn.error-btn {
      background: var(--danger);
    }

    /* =========================================================
8. Responsive layout
       ========================================================= */
    @media (max-width: 640px) {
      body {
        display: block;
        padding: 14px;
        background: var(--page);
      }

      .card {
        width: 100%;
        min-height: calc(100vh - 28px);
        padding: 16px 14px 20px;
        border: 1px solid rgba(216, 231, 223, 0.95);
        border-radius: 12px;
        box-shadow: var(--shadow-card);
      }

      .accent {
        height: 4px;
      }

      .banner {
        margin-bottom: 12px;
        border-radius: 11px;
      }

      .event-card {
        padding: 12px 11px;
      }

      .event-card h2,
      #eventTitle {
        font-size: 16.5px;
      }

      .meta-pill {
        font-size: 9.8px;
      }

      .instructions {
        font-size: 10.8px;
      }

      #geoForm {
        grid-template-columns: minmax(0, 1fr);
        gap: 11px;
      }

      .group,
      .full,
      .map-head,
      .buttons {
        grid-column: 1 / -1;
      }

      input[type="text"],
      input[type="tel"] {
        min-height: 42px;
        font-size: 14px;
      }

      #map {
        height: 185px;
      }

      .buttons {
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .buttons button {
        min-height: 44px;
        font-size: 12px;
      }
    }

    @media (max-width: 360px) {
      .card {
        padding-right: 12px;
        padding-left: 12px;
      }

      .map-head {
        align-items: flex-start;
      }

      .refresh-btn {
        padding-right: 8px;
        padding-left: 8px;
        font-size: 9px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }

      .refresh-btn.is-loading .refresh-icon {
        animation-duration: 1.8s;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="accent"></div>
    <img src="https://lh3.googleusercontent.com/d/1cl2HKmc_y_TYIvlQ81qh_ZVoelZD-eQ_" alt="Banner HKN 2026" class="banner">

    <section class="event-card" aria-label="Informasi Kegiatan">
      <div id="currentDate" class="date-badge">Memuat tanggal...</div>
      <h2 id="eventTitle">Daftar Hadir<br>Memuat Kegiatan...</h2>
      <div id="eventMeta" class="event-meta">
        <span class="meta-pill">Memuat detail lokasi...</span>
      </div>
      <hr class="event-divider">
      <div class="instructions">
        <div class="instructions-title">
          Bukti kehadiran menggunakan foto <b>wajib</b> menggunakan aplikasi <b>TimeMark</b>:
        </div>
        <div class="store-links">
          <a class="store-chip" href="https://play.google.com/store/apps/details?id=com.oceangalaxy.camera.new" target="_blank" rel="noopener noreferrer">
            <img src="./play-store.png" alt="" class="store-icon" aria-hidden="true">
            <span>Android (Play Store)</span>
          </a>
          <a class="store-chip" href="https://apps.apple.com/app/apple-store/id6446071834?pt=126093046&ct=official_website&mt=8" target="_blank" rel="noopener noreferrer">
            <img src="./apps-store.png" alt="" class="store-icon" aria-hidden="true">
            <span>iOS (App Store)</span>
          </a>
        </div>
      </div>
    </section>

    <form id="geoForm" novalidate>
      <div class="group full">
        <label for="nama">Nama *</label>
        <div class="ac-wrap">
          <input type="text" id="nama" placeholder="Cari / masukkan nama lengkap" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="acListNama" required>
          <svg class="ac-search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
            <path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <ul id="acListNama" class="ac-list" role="listbox"></ul>
        </div>
      </div>
      <div class="group">
        <label for="nip">NIP *</label>
        <div class="ac-wrap">
          <input type="text" id="nip" placeholder="Cari / masukkan NIP" inputmode="numeric" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="acListNip" required>
          <svg class="ac-search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
            <path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <ul id="acListNip" class="ac-list" role="listbox"></ul>
        </div>
      </div>
      <div class="group"><label for="timKerja">Tim Kerja / Direktorat *</label><input type="text" id="timKerja" placeholder="Contoh: Tim Kerja ... / Direktorat ..." required></div>
      <div class="group full"><label for="noTelp">No Telepon / WhatsApp *</label><input type="tel" id="noTelp" placeholder="Contoh: 081234567890" autocomplete="tel" required></div>

      <div class="group full">
        <label for="fotoKedatangan">Upload Foto Selfie (Wajib TimeMark) *</label>
        <div class="upload-wrapper">
          <input type="file" id="fotoKedatangan" class="sr-only-input" accept="image/*" required>
          <button type="button" id="uploadTriggerBtn" class="upload-btn" onclick="document.getElementById('fotoKedatangan').click()">
            <svg
              aria-hidden="true"
              stroke="currentColor"

              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                stroke-width="2"
                stroke="#ffffff"
                d="M13.5 3H12H8C6.34315 3 5 4.34315 5 6V18C5 19.6569 6.34315 21 8 21H11M13.5 3L19 8.625M13.5 3V7.625C13.5 8.17728 13.9477 8.625 14.5 8.625H19M19 8.625V11.8125"
                stroke-linejoin="round"
                stroke-linecap="round"
              ></path>
              <path
                stroke-linejoin="round"
                stroke-linecap="round"
                stroke-width="2"
                stroke="#ffffff"
                d="M17 15V18M17 21V18M17 18H14M17 18H20"
              ></path>
            </svg>
            <span id="uploadBtnText">Upload Foto Selfie</span>
          </button>
          <div id="fileNameDisplay" class="file-status">Belum ada file dipilih (Maks. 15 MB)</div>
        </div>
      </div>

      <div class="map-head">
        <label>Lokasi Anda : </label>
        <button type="button" id="refreshGpsBtn" class="refresh-btn" onclick="refreshGPS()" aria-label="Refresh GPS">
          <svg class="refresh-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M20 7v5h-5M4 17v-5h5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M5.6 9a7 7 0 0 1 11.7-2L20 12M4 12l2.7 5a7 7 0 0 0 11.7-2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span>Refresh GPS</span>
        </button>

      <div id="map" class="full"></div>

        <button type="button" id="btnCheckIn" class="checkin" onclick="submitForm('checkin')">📍 Check In (Datang)</button>
        <button type="button" id="btnCheckOut" class="checkout" onclick="submitForm('checkout')">🏁 Check Out (Pulang)</button>
      </div>
    </form>

    <div id="status" role="status" aria-live="polite"></div>
    <div class="footer" id="versionDisplay">GeoAttend-HKN62 • Memuat versi...</div>
  </main>

  <div id="popupModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-box">
      <div id="modalIcon" class="modal-icon success">✓</div>
      <h3 id="modalTitle">Informasi</h3>
      <p id="modalMessage"></p>
      <button id="modalActionBtn" class="modal-btn" onclick="closeModal()">OK</button>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script>
    // Ganti dengan URL Web App Google Apps Script (/exec) terbaru Anda
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyx-KOGfFB6Z91NZcHle0gITQxbPuq_btXeGD0mL82Xc_nNDrC2nn_js9hTCpOpZNh1_A/exec";

    const MAX_FILE_BYTES = 15 * 1024 * 1024;
    const DIRECTORY_CACHE_KEY = "geoattend_hkn62_directory_v1";
    let attendanceConfig = null;
    let participantDirectory = [];
    let map = null;
    let userMarker = null;
    let fenceCircle = null;
    let isSubmitting = false;
    let wasSuccessful = false;

    window.addEventListener("DOMContentLoaded", async function() {
      document.getElementById("currentDate").textContent =
        "📅 " + new Date().toLocaleDateString("id-ID", {
          weekday:"long", year:"numeric", month:"long", day:"numeric"
        });

      const fileInput = document.getElementById("fotoKedatangan");
      fileInput.addEventListener("change", updateFilePreview);

      initParticipantAutocomplete();

      try {
        await loadAttendanceConfig();
        loadParticipantDirectory();
        initMap();
      } catch (error) {
        document.getElementById("versionDisplay").textContent = "GeoAttend-HKN62 • v2.0.0";
        document.getElementById("eventTitle").textContent = "Daftar Hadir";
        document.getElementById("eventMeta").innerHTML = "";
        showPopup(false, "Gagal Memuat Konfigurasi",
          "Tidak dapat membaca konfigurasi dari server: " + error.message);
      }
    });

    /* =========================================================
       Searchable Autocomplete Directory (Nama, NIP, No Telp)
       ========================================================= */
    function normalizePersonRecord(raw) {
      if (!raw || typeof raw !== "object") return null;
      const nama = String(raw.nama ?? raw.Nama ?? raw.name ?? raw.Name ?? raw.fullName ?? "").trim();
      const nip = String(raw.nip ?? raw.NIP ?? raw.Nip ?? raw.nik ?? raw.NIK ?? "").replace(/^'+/, "").trim();
      const timKerja = String(raw.timKerja ?? raw.TimKerja ?? raw["Tim Kerja"] ?? raw["Tim Kerja / Direktorat"] ?? raw.direktorat ?? raw.unit ?? "").trim();
      const noTelp = String(raw.noTelp ?? raw.NoTelp ?? raw["No Telepon"] ?? raw["No Telepon / WhatsApp"] ?? raw.telp ?? raw.phone ?? raw.wa ?? "").replace(/^'+/, "").trim();
      if (!nama && !nip) return null;
      return { nama, nip, timKerja, noTelp };
    }

    function mergeParticipantDirectory(records) {
      if (!Array.isArray(records)) return;
      const mapByKey = new Map();

      participantDirectory.forEach(item => {
        const key = (item.nip || item.nama).toLowerCase();
        if (key) mapByKey.set(key, item);
      });

      records.forEach(raw => {
        const item = normalizePersonRecord(raw);
        if (!item) return;
        const key = (item.nip || item.nama).toLowerCase();
        const existing = mapByKey.get(key) || {};
        mapByKey.set(key, {
          nama: item.nama || existing.nama || "",
          nip: item.nip || existing.nip || "",
          timKerja: item.timKerja || existing.timKerja || "",
          noTelp: item.noTelp || existing.noTelp || ""
        });
      });

      participantDirectory = Array.from(mapByKey.values());
      try {
        localStorage.setItem(DIRECTORY_CACHE_KEY, JSON.stringify(participantDirectory));
      } catch (e) {
        // Abaikan jika storage penuh/diblokir
      }
    }

    function loadCachedDirectory() {
      try {
        const raw = localStorage.getItem(DIRECTORY_CACHE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          mergeParticipantDirectory(parsed);
        }
      } catch (e) {
        // Abaikan cache korup
      }
    }

    async function loadParticipantDirectory() {
      loadCachedDirectory();
      if (!GAS_WEB_APP_URL || !GAS_WEB_APP_URL.startsWith("https://")) return;

      const actions = ["getParticipants", "getPegawai", "getRecords", "getAttendance"];
      for (const action of actions) {
        try {
          const url = GAS_WEB_APP_URL + (GAS_WEB_APP_URL.includes("?") ? "&" : "?") + "action=" + action + "&_t=" + Date.now();
          const res = await fetch(url, { method: "GET", redirect: "follow" });
          if (!res.ok) continue;
          const data = await res.json();
          const list = Array.isArray(data)
            ? data
            : (data.participants || data.pegawai || data.records || data.data || data.rows || null);
          if (Array.isArray(list) && list.length > 0) {
            mergeParticipantDirectory(list);
            break;
          }
        } catch (err) {
          // Lanjut ke action fallback berikutnya
        }
      }
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, ch => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;"
      }[ch]));
    }

    function highlightMatch(text, query) {
      const safeText = escapeHtml(text);
      if (!query) return safeText;
      const escapedQuery = query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      return safeText.replace(new RegExp("(" + escapedQuery + ")", "ig"), '<span class="ac-mark">$1</span>');
    }

    function applyAutocompleteSelection(person) {
      const fields = [
        { id: "nama", val: person.nama },
        { id: "nip", val: person.nip },
        { id: "timKerja", val: person.timKerja },
        { id: "noTelp", val: person.noTelp }
      ];

      fields.forEach(f => {
        if (!f.val) return;
        const el = document.getElementById(f.id);
        el.value = f.val;
        el.classList.remove("ac-filled-flash");
        void el.offsetWidth;
        el.classList.add("ac-filled-flash");
      });
    }

    function attachAutocomplete(inputId, listId, primaryField) {
      const input = document.getElementById(inputId);
      const list = document.getElementById(listId);
      let activeIndex = -1;
      let currentMatches = [];

      const closeList = () => {
        list.classList.remove("is-open");
        input.setAttribute("aria-expanded", "false");
        activeIndex = -1;
      };

      const renderMatches = () => {
        const rawQuery = input.value.trim();
        if (rawQuery.length < 2 || participantDirectory.length === 0) {
          closeList();
          return;
        }

        const q = rawQuery.toLowerCase();
        const qDigits = rawQuery.replace(/\s+/g, "");

        currentMatches = participantDirectory
          .filter(item => {
            const namaMatch = item.nama.toLowerCase().includes(q);
            const nipMatch = item.nip.toLowerCase().includes(qDigits);
            const unitMatch = item.timKerja.toLowerCase().includes(q);
            return namaMatch || nipMatch || unitMatch;
          })
          .sort((a, b) => {
            const aPrimary = (primaryField === "nip" ? a.nip : a.nama).toLowerCase();
            const bPrimary = (primaryField === "nip" ? b.nip : b.nama).toLowerCase();
            const aStarts = aPrimary.startsWith(q) ? 0 : 1;
            const bStarts = bPrimary.startsWith(q) ? 0 : 1;
            if (aStarts !== bStarts) return aStarts - bStarts;
            return a.nama.localeCompare(b.nama, "id");
          })
          .slice(0, 8);

        if (currentMatches.length === 0) {
          closeList();
          return;
        }

        list.innerHTML = "";
        activeIndex = -1;

        currentMatches.forEach((person, idx) => {
          const li = document.createElement("li");
          li.className = "ac-item";
          li.setAttribute("role", "option");
          li.dataset.index = String(idx);

          const metaParts = [];
          if (person.nip) metaParts.push("NIP: " + highlightMatch(person.nip, rawQuery));
          if (person.noTelp) metaParts.push("Telp: " + escapeHtml(person.noTelp));
          if (person.timKerja) metaParts.push(highlightMatch(person.timKerja, rawQuery));

          li.innerHTML =
            '<div class="ac-name">' + highlightMatch(person.nama || "(Tanpa Nama)", rawQuery) + '</div>' +
            (metaParts.length ? '<div class="ac-meta">' + metaParts.join(" • ") + '</div>' : "");

          li.addEventListener("mousedown", function(e) {
            e.preventDefault();
            applyAutocompleteSelection(person);
            closeList();
          });

          list.appendChild(li);
        });

        list.classList.add("is-open");
        input.setAttribute("aria-expanded", "true");
      };

      const updateActiveItem = () => {
        const items = list.querySelectorAll(".ac-item");
        items.forEach((el, idx) => {
          el.classList.toggle("is-active", idx === activeIndex);
          if (idx === activeIndex) {
            el.scrollIntoView({ block: "nearest" });
          }
        });
      };

      input.addEventListener("input", renderMatches);
      input.addEventListener("focus", renderMatches);
      input.addEventListener("blur", () => setTimeout(closeList, 140));

      input.addEventListener("keydown", function(e) {
        if (!list.classList.contains("is-open") || currentMatches.length === 0) return;

        if (e.key === "ArrowDown") {
          e.preventDefault();
          activeIndex = (activeIndex + 1) % currentMatches.length;
          updateActiveItem();
        } else if (e.key === "ArrowUp") {
          e.preventDefault();
          activeIndex = (activeIndex - 1 + currentMatches.length) % currentMatches.length;
          updateActiveItem();
        } else if (e.key === "Enter" && activeIndex >= 0) {
          e.preventDefault();
          applyAutocompleteSelection(currentMatches[activeIndex]);
          closeList();
        } else if (e.key === "Escape") {
          closeList();
        }
      });
    }

    function initParticipantAutocomplete() {
      loadCachedDirectory();
      attachAutocomplete("nama", "acListNama", "nama");
      attachAutocomplete("nip", "acListNip", "nip");
    }

    function updateFilePreview() {
      const fileInput = document.getElementById("fotoKedatangan");
      const statusEl = document.getElementById("fileNameDisplay");
      const btnTextEl = document.getElementById("uploadBtnText");
      const file = fileInput.files && fileInput.files[0];

      if (file) {
        const sizeMb = (file.size / (1024 * 1024)).toFixed(2);
        statusEl.textContent = "✓ " + file.name + " (" + sizeMb + " MB)";
        statusEl.classList.add("has-file");
        btnTextEl.textContent = "Ganti Foto Selfie";
      } else {
        statusEl.textContent = "Belum ada file dipilih (Maks. 15 MB)";
        statusEl.classList.remove("has-file");
        btnTextEl.textContent = "Upload Foto Selfie";
      }
    }

    function renderEventHeader(config) {
      const titleEl = document.getElementById("eventTitle");
      const metaEl = document.getElementById("eventMeta");

      titleEl.innerHTML = "";
      titleEl.appendChild(document.createTextNode("Daftar Hadir"));
      if (config.eventName) {
        titleEl.appendChild(document.createElement("br"));
        titleEl.appendChild(document.createTextNode(config.eventName));
        document.title = "GeoAttend • " + config.eventName;
      }

      metaEl.innerHTML = "";
      const isStrict = config.restrict === "YES";
      const restrictLabel = isStrict ? "Strict Geofence" : "Open Location";

      const pills = [];
      if (config.locationName) {
        pills.push({ text: "📍 " + config.locationName, open: false });
      }
      if (Number.isFinite(config.allowedRadius) && config.allowedRadius > 0) {
        pills.push({ text: "🎯 Radius " + Math.round(config.allowedRadius) + " m", open: false });
      }
      pills.push({
        text: (isStrict ? "🔒 " : "🌐 ") + restrictLabel,
        open: !isStrict
      });

      pills.forEach(item => {
        const span = document.createElement("span");
        span.className = "meta-pill" + (item.open ? " is-open" : "");
        span.textContent = item.text;
        metaEl.appendChild(span);
      });
    }

    async function loadAttendanceConfig() {
      if (!GAS_WEB_APP_URL || !GAS_WEB_APP_URL.startsWith("https://")) {
        throw new Error("URL Web App Google Apps Script belum dikonfigurasi.");
      }

      const url = GAS_WEB_APP_URL + (GAS_WEB_APP_URL.includes("?") ? "&" : "?") + "action=getConfig&_t=" + Date.now();
      const response = await fetch(url, {
        method: "GET",
        redirect: "follow"
      });

      if (!response.ok) {
        throw new Error("HTTP " + response.status + " saat mengambil konfigurasi.");
      }

      const payload = await response.json();
      const config = payload.config ? payload.config : payload;

      if (!config || typeof config !== "object") {
        throw new Error("Respons konfigurasi kosong atau tidak valid.");
      }

      if (payload.version || config.version) {
        document.getElementById("versionDisplay").textContent =
          "GeoAttend-HKN62 • " + String(payload.version || config.version);
      } else {
        document.getElementById("versionDisplay").textContent = "GeoAttend-HKN62 • v2.0.0";
      }

      if (Array.isArray(payload.participants || config.participants)) {
        mergeParticipantDirectory(payload.participants || config.participants);
      }

      const rawAllowedRadius = Number(config.allowedRadius ?? config.AllowedRadius);
      const rawRadiusKm = Number(config.radiusKm);
      const resolvedRadiusKm = Number.isFinite(rawRadiusKm) && rawRadiusKm > 0
        ? rawRadiusKm
        : (Number.isFinite(rawAllowedRadius) && rawAllowedRadius > 0 ? rawAllowedRadius / 1000 : NaN);
      const resolvedAllowedRadius = Number.isFinite(rawAllowedRadius) && rawAllowedRadius > 0
        ? rawAllowedRadius
        : (Number.isFinite(resolvedRadiusKm) ? Math.round(resolvedRadiusKm * 1000) : NaN);

      const normalized = {
        eventName: String(config.eventName ?? config.EventName ?? "").trim(),
        locationName: String(config.locationName ?? config.LocationName ?? "").trim(),
        targetLat: Number(config.targetLat ?? config.Latitude),
        targetLng: Number(config.targetLng ?? config.Longitude),
        allowedRadius: resolvedAllowedRadius,
        radiusKm: resolvedRadiusKm,
        restrict: String(config.restrict ?? config.Restrict ?? "").trim().toUpperCase()
      };

      if (!Number.isFinite(normalized.targetLat) ||
          !Number.isFinite(normalized.targetLng) ||
          !Number.isFinite(normalized.radiusKm) ||
          normalized.radiusKm <= 0 ||
          !["YES", "NO"].includes(normalized.restrict)) {
        throw new Error("Nilai latitude, longitude, radius, atau restrict tidak valid.");
      }

      attendanceConfig = normalized;
      renderEventHeader(attendanceConfig);
      console.log("Live attendance config:", attendanceConfig);
      return attendanceConfig;
    }

    function setButtonsDisabled(disabled) {
      document.getElementById("btnCheckIn").disabled = disabled;
      document.getElementById("btnCheckOut").disabled = disabled;
    }

    function showPopup(success, title, message) {
      document.getElementById("modalTitle").textContent = title;
      document.getElementById("modalMessage").textContent = message;
      const icon = document.getElementById("modalIcon");
      const button = document.getElementById("modalActionBtn");
      icon.className = "modal-icon " + (success ? "success" : "error");
      icon.textContent = success ? "✓" : "✕";
      button.className = "modal-btn" + (success ? "" : " error-btn");
      wasSuccessful = success;
      document.getElementById("popupModal").style.display = "flex";
      button.focus();
    }

    function closeModal() {
      document.getElementById("popupModal").style.display = "none";
      if (wasSuccessful) {
        document.getElementById("geoForm").reset();
        updateFilePreview();
        wasSuccessful = false;
        refreshGPS();
        window.scrollTo({top:0, behavior:"smooth"});
      }
    }

    function calculateDistanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2-lat1)*Math.PI/180;
      const dLon = (lon2-lon1)*Math.PI/180;
      const a = Math.sin(dLat/2)**2 +
        Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function renderMapAt(lat, lng, zoom) {
      const mapEl = document.getElementById("map");
      mapEl.style.display = "block";

      if (!map) {
        map = L.map("map").setView([lat,lng],zoom);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          attribution:"&copy; OpenStreetMap contributors", maxZoom:19
        }).addTo(map);
      } else {
        map.setView([lat,lng],zoom);
      }

      if (userMarker) userMarker.setLatLng([lat,lng]);
      else userMarker = L.marker([lat,lng]).addTo(map);
      userMarker.bindPopup("Lokasi Anda Saat Ini");

      if (attendanceConfig && attendanceConfig.restrict === "YES") {
        const center = [attendanceConfig.targetLat, attendanceConfig.targetLng];
        if (fenceCircle) {
          fenceCircle.setLatLng(center);
          fenceCircle.setRadius(attendanceConfig.radiusKm * 1000);
        } else {
          fenceCircle = L.circle(center, {
            color:"#1b8a5a", fillColor:"#28a76f",
            fillOpacity:.15, radius:attendanceConfig.radiusKm*1000
          }).addTo(map);
        }
        const zoneTitle = attendanceConfig.locationName || "Zona absensi";
        fenceCircle.bindPopup(zoneTitle + " (" +
          Math.round(attendanceConfig.radiusKm*1000) + " meter)");
      } else if (fenceCircle) {
        map.removeLayer(fenceCircle);
        fenceCircle = null;
      }

      setTimeout(() => map && map.invalidateSize(), 120);
    }

    function getCurrentPosition() {
      return new Promise((resolve,reject) => {
        if (!navigator.geolocation) {
          reject(new Error("Browser tidak mendukung geolocation."));
          return;
        }
        navigator.geolocation.getCurrentPosition(
          position => resolve(position),
          error => {
            const messages = {
              1:"Izin lokasi ditolak. Izinkan akses lokasi pada browser.",
              2:"Posisi GPS tidak tersedia. Pastikan layanan lokasi aktif.",
              3:"Waktu pengambilan GPS habis. Silakan coba kembali."
            };
            reject(new Error(messages[error.code] || error.message || "Gagal mengambil GPS."));
          },
          {enableHighAccuracy:true, timeout:20000, maximumAge:0}
        );
      });
    }

    async function initMap() {
      try {
        const position = await getCurrentPosition();
        renderMapAt(position.coords.latitude, position.coords.longitude, 15);
      } catch (error) {
        document.getElementById("status").textContent = error.message;
      }
    }

    async function refreshGPS() {
      const status = document.getElementById("status");
      const refreshButton = document.getElementById("refreshGpsBtn");

      refreshButton.classList.add("is-loading");
      refreshButton.disabled = true;
      refreshButton.setAttribute("aria-busy", "true");
      status.textContent = "Memperbarui posisi GPS...";

      try {
        const position = await getCurrentPosition();
        renderMapAt(position.coords.latitude, position.coords.longitude, 16);
        status.textContent = "GPS berhasil diperbarui.";
      } catch (error) {
        status.textContent = "";
        showPopup(false, "Gagal GPS", error.message);
      } finally {
        refreshButton.classList.remove("is-loading");
        refreshButton.disabled = false;
        refreshButton.removeAttribute("aria-busy");
      }
    }

    function readFileAsBase64(file) {
      return new Promise((resolve,reject) => {
        const reader = new FileReader();
        reader.onload = event => resolve({
          data:event.target.result, name:file.name, mime:file.type || "image/jpeg"
        });
        reader.onerror = () => reject(new Error("Browser gagal membaca file foto."));
        reader.readAsDataURL(file);
      });
    }

    async function submitForm(actionType) {
      if (isSubmitting) return;

      const status = document.getElementById("status");
      const nama = document.getElementById("nama").value.trim();
      const nip = document.getElementById("nip").value.trim();
      const timKerja = document.getElementById("timKerja").value.trim();
      const noTelp = document.getElementById("noTelp").value.trim();
      const file = document.getElementById("fotoKedatangan").files[0];

      if (!nama || !nip || !timKerja || !noTelp || !file) {
        showPopup(false, "Data Belum Lengkap",
          "Nama, NIP, Tim Kerja, No Telepon, dan foto selfie wajib diisi.");
        return;
      }
      if (!file.type || !file.type.startsWith("image/")) {
        showPopup(false, "Format Tidak Valid", "File harus berupa gambar.");
        return;
      }
      if (file.size > MAX_FILE_BYTES) {
        showPopup(false, "Ukuran File Terlalu Besar", "Ukuran foto maksimal 15 MB.");
        return;
      }

      isSubmitting = true;
      setButtonsDisabled(true);
      status.textContent = "Memuat konfigurasi terbaru...";

      const releaseLock = () => {
        isSubmitting = false;
        setButtonsDisabled(false);
        status.textContent = "";
      };

      try {
        await loadAttendanceConfig();

        status.textContent = "Membaca foto dan mengambil koordinat GPS...";
        const photo = await readFileAsBase64(file);
        const position = await getCurrentPosition();
        const userLat = position.coords.latitude;
        const userLng = position.coords.longitude;

        if (attendanceConfig.restrict === "YES") {
          const distance = calculateDistanceKm(
            userLat, userLng,
            attendanceConfig.targetLat, attendanceConfig.targetLng
          );

          if (distance > attendanceConfig.radiusKm) {
            const distanceM = Math.round(distance*1000);
            const limitM = Math.round(attendanceConfig.radiusKm*1000);
            releaseLock();
            showPopup(false, "Di Luar Radius Absensi",
              "Posisi Anda berjarak " + distanceM +
              " meter dari pusat lokasi. Batas maksimal " + limitM + " meter.");
            return;
          }
        } else {
          console.info("Geofencing OFF: submission allowed from any location.");
        }

        renderMapAt(userLat,userLng,16);
        status.textContent = "⏫ Mengirim data ke server...";

        const formData = {
          actionType, nama, nip, timKerja, noTelp,
          kedatanganData:photo.data,
          kedatanganName:photo.name,
          kedatanganMime:photo.mime,
          latitude:userLat,
          longitude:userLng
        };

        // Menggunakan text/plain agar terhindar dari CORS preflight OPTIONS di Google Apps Script
        const response = await fetch(GAS_WEB_APP_URL, {
          method: "POST",
          redirect: "follow",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify(formData)
        });

        if (!response.ok) {
          throw new Error("HTTP " + response.status + " dari server.");
        }

        const result = await response.json();
        releaseLock();

        if (result && result.success) {
          mergeParticipantDirectory([{ nama, nip, timKerja, noTelp }]);
          showPopup(true, "Berhasil", result.message);
        } else {
          showPopup(false, "Gagal", result ? result.message : "Respons server tidak valid.");
        }

      } catch (error) {
        releaseLock();
        console.error("Attendance submission failed:", error);
        showPopup(false, "Gagal Memproses Absensi", error.message || String(error));
      }
    }
  </script>
</body>
</html>
